<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - Dec 17, 11:45 PM Qatar Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown to December 17, 2025</h1>
        <h2>11:45 PM Qatar Time</h2>

        <div class="countdown">
            <div class="time-box">
                <span id="days" class="time">0</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span id="hours" class="time">0</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span id="minutes" class="time">0</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span id="seconds" class="time">0</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
