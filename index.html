<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Until We're Together Again ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-background">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <div class="container">
        <div class="header-content">
            <div class="love-icon">❤️</div>
            <h1 class="main-title">Until We're Together Again</h1>
            <p class="subtitle">After months apart, our hearts will reunite</p>
            <div class="meeting-details">
                <span class="location">📍 Qatar</span>
                <span class="date">🗓️ December 17, 2025 • 11:45 PM</span>
            </div>
        </div>

        <div class="quote">
            "Distance means so little when someone means so much"
        </div>

        <div class="countdown">
            <div class="time-box">
                <span id="days" class="time">0</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span id="hours" class="time">0</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span id="minutes" class="time">0</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span id="seconds" class="time">0</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="love-notes">
            <p class="love-note">Every second brings us closer to the moment we've been waiting for</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
